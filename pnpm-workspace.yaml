packages:
  - "apps/*"
  - "packages/*"
  # Leftovers from the create-turbo starter; not part of Roll.
  - "!apps/docs"
  - "!packages/ui"
minimumReleaseAgeExclude:
  - zod@4.6.6
  - '@radix-ui/react-dismissable-layer@1.2.1'
  - '@radix-ui/react-dropdown-menu@2.2.1'
  - '@radix-ui/react-focus-scope@1.3.1'
  - '@radix-ui/react-menu@2.2.1'
  - '@radix-ui/react-roving-focus@1.2.1'
# The web app uses React 19 types and the extension React 18 types. These
# libraries import "react" types without declaring @types/react as a peer, so
# pnpm would otherwise hand them whichever version got hoisted.
packageExtensions:
  next-themes:
    peerDependencies:
      "@types/react": "*"
  sonner:
    peerDependencies:
      "@types/react": "*"
