<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Roll camera</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
        display: block;
      }
      p {
        position: absolute;
        inset: 0;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        text-align: center;
        color: #fff;
        font: 12px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <video autoplay muted playsinline></video>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
